interface:
  display_name: "公众号生产总控"
  short_description: "自动统领排版、配图、dry-run 和草稿箱发布。"
  default_prompt: "Use $duyi-wechat to turn this finished WeChat article into a draft with formatting, images, QA, and publishing."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "claude"
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    claude: "neutral-source-plus-adapter"
    openai: "metadata-adapter"
    generic: "neutral-source"
